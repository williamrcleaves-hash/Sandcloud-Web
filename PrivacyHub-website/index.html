<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Hub</title>
<script src="config.js"></script>
<style>
  :root { --bg:#0c0c0c; --card:#161616; --line:#2a2a2a; --text:#eee; --dim:#8a8a8a; --ok:#c4e1c4; --bad:#e6b0aa; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 42rem; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
  h1 { font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; margin: 0 0 1.5rem; color: var(--dim); }
  h2 { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; color: var(--dim); margin: 1.75rem 0 .6rem; }
  .card { background: var(--card); border: 1px solid var(--line); padding: 1rem; margin: 0 0 .75rem; }
  .row { display:flex; justify-content:space-between; align-items:center; gap: 1rem; }
  .name { font-size: 1.05rem; }
  .meta { font-size: .8rem; color: var(--dim); margin-top: .2rem; word-break: break-all; }
  button { appearance:none; border:1px solid var(--line); background:#111; color:var(--text); padding:.55rem .8rem; font: inherit; letter-spacing:.04em; cursor:pointer; }
  button.on { border-color: var(--ok); color: var(--ok); }
  button.off { border-color: var(--bad); color: var(--bad); }
  button.big { width:100%; padding: 1rem; font-size: .85rem; letter-spacing:.16em; text-transform:uppercase; }
  input { width:100%; background:#111; border:1px solid var(--line); color:var(--text); padding:.55rem .7rem; font: inherit; }
  form { display:flex; gap:.5rem; margin-top:.6rem; }
  form input { flex:1; }
  ul { list-style:none; padding:0; margin:.5rem 0 0; }
  li { display:flex; justify-content:space-between; align-items:center; padding:.4rem 0; border-top:1px solid var(--line); font-size:.9rem; }
  .dot { width:.55rem; height:.55rem; border-radius:50%; display:inline-block; margin-right:.4rem; background:var(--dim); }
  .dot.ok { background:var(--ok); }
  .dot.bad { background:var(--bad); }
  p.warn { color:var(--bad); font-size:.85rem; }
  a { color: var(--ok); }
</style>
</head>
<body>
<main>
  <h1>Privacy Hub</h1>
  <p class="meta" id="via"></p>
  <div class="card">
    <div class="row">
      <div>
        <div class="name" id="ssid">TrustHub</div>
        <div class="meta" id="summary">connecting…</div>
      </div>
      <div id="health"></div>
    </div>
  </div>
  <button class="big off" id="kill" type="button">Internet off · LAN stays on</button>
  <div class="card row" style="margin-top:1rem">
    <div>
      <div class="name">Ad blocking</div>
      <div class="meta" id="ag-meta">AdGuard</div>
    </div>
    <button type="button" id="adblock">On</button>
  </div>

  <h2>Devices</h2>
  <div id="devices"></div>

  <h2>Block a site</h2>
  <div class="card">
    <form id="block-form"><input name="domain" placeholder="tiktok.com" autocomplete="off"><button type="submit">Block</button></form>
    <ul id="blocklist"></ul>
  </div>
  <h2>Allow a site</h2>
  <div class="card">
    <form id="allow-form"><input name="domain" placeholder="example.com" autocomplete="off"><button type="submit">Allow</button></form>
    <ul id="allowlist"></ul>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const LAN_CANDIDATES = ["http://10.10.10.1:8080", "http://10.42.0.1:8080"];
let base = "";
let state = null;

function remoteOrigin() {
  const v = (window.PRIVACY_HUB_API || "").replace(/\/$/, "");
  return v;
}

function sameOriginPi() {
  const h = location.hostname;
  return h === "10.10.10.1" || h === "10.42.0.1" || h === "127.0.0.1" || h === "localhost";
}

async function probe(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(url + "/api/state", { signal: c.signal, credentials: "include" });
    clearTimeout(t);
    return r.ok;
  } catch {
    clearTimeout(t);
    return false;
  }
}

async function pickBase() {
  if (sameOriginPi()) return "";
  for (const u of LAN_CANDIDATES) {
    if (await probe(u, 700)) return u;
  }
  return remoteOrigin();
}

async function api(path, body) {
  if (base === null) return;
  const url = (base || "") + path;
  const r = await fetch(url, {
    method: body ? "POST" : "GET",
    credentials: "include",
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const ct = r.headers.get("content-type") || "";
  if (r.status === 401 || (ct.includes("text/html") && !ct.includes("json"))) {
    const remote = remoteOrigin();
    $("summary").innerHTML = "Cloudflare login required. " +
      (remote ? '<a href="' + remote + '/">Open secure hub</a> (email PIN), then reload this page.' : "Set API_ORIGIN on GitHub Pages.");
    return;
  }
  if (!r.ok) {
    $("summary").textContent = "API error " + r.status;
    return;
  }
  state = await r.json();
  render();
}

function render() {
  if (!state) return;
  $("ssid").textContent = state.ssid || "TrustHub";
  $("summary").textContent = (state.lan_ip || "") + " · " + (state.wan_up ? "Pi has WAN" : "Pi has no WAN ping");
  $("health").innerHTML =
    '<span class="dot ' + (state.wan_up ? "ok" : "bad") + '"></span>WAN ' +
    '<span class="dot ' + (state.adguard ? "ok" : "bad") + '"></span>DNS';
  $("kill").textContent = state.internet ? "Cut internet · keep LAN" : "Restore internet";
  $("kill").className = "big " + (state.internet ? "off" : "on");
  $("ag-meta").textContent = state.adguard ? "AdGuard is up" : "AdGuard is down — lists apply when it starts";
  $("adblock").textContent = state.adblock ? "On" : "Off";
  $("adblock").className = state.adblock ? "on" : "off";

  const box = $("devices");
  if (!state.devices.length) {
    box.innerHTML = '<p class="warn">No clients yet. Toggle phone Wi-Fi off/on if this is empty.</p>';
  } else {
    box.innerHTML = state.devices.map((d) =>
      '<div class="card row"><div><div class="name">' + (d.name || d.ip) + '</div>' +
      '<div class="meta">' + d.ip + (d.mac ? " · " + d.mac : "") + '</div></div>' +
      '<button type="button" class="' + (d.blocked ? "off" : "on") + '" data-ip="' + d.ip + '" data-blocked="' + (d.blocked ? "1" : "0") + '">' +
      (d.blocked ? "Blocked" : "Allowed") + "</button></div>"
    ).join("");
    box.querySelectorAll("button[data-ip]").forEach((b) => {
      b.onclick = () => api("/api/device", { ip: b.dataset.ip, blocked: b.dataset.blocked !== "1" });
    });
  }

  const list = (id, arr, kind) => {
    $(id).innerHTML = arr.map((d) =>
      "<li><span>" + d + '</span><button type="button" data-kind="' + kind + '" data-d="' + d + '">Remove</button></li>'
    ).join("") || "<li><span style='color:#8a8a8a'>None</span></li>";
    $(id).querySelectorAll("button[data-d]").forEach((b) => {
      b.onclick = () => api("/api/list", { kind: b.dataset.kind, domain: b.dataset.d, remove: true });
    });
  };
  list("blocklist", state.blocklist || [], "blocklist");
  list("allowlist", state.allowlist || [], "allowlist");
}

$("kill").onclick = () => api("/api/internet", { enabled: !(state && state.internet) });
$("adblock").onclick = () => api("/api/adblock", { enabled: !(state && state.adblock) });
$("block-form").onsubmit = (e) => { e.preventDefault(); api("/api/list", { kind: "blocklist", domain: e.target.domain.value }); e.target.reset(); };
$("allow-form").onsubmit = (e) => { e.preventDefault(); api("/api/list", { kind: "allowlist", domain: e.target.domain.value }); e.target.reset(); };

(async () => {
  base = await pickBase();
  if (base === "" && !sameOriginPi() && !remoteOrigin()) {
    $("summary").textContent = "Not on TrustHub, and API_ORIGIN is not set on GitHub Pages.";
    return;
  }
  $("via").textContent = sameOriginPi() ? "via Pi LAN" : (base.startsWith("http://10.") ? "via home LAN" : "via Cloudflare");
  await api("/api/state");
  setInterval(() => { if (!document.hidden) api("/api/state"); }, 4000);
})();
</script>
</body>
</html>
