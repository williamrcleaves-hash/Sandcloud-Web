<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandcloud</title>
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.renderGoogle && window.renderGoogle()"></script>
<style>
  :root { --bg:#0c0c0c; --card:#161616; --line:#2a2a2a; --text:#eee; --dim:#8a8a8a; --ok:#c4e1c4; --bad:#e6b0aa; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 42rem; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
  h1 { font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; margin: 0 0 1.5rem; color: var(--dim); }
  h2 { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; color: var(--dim); margin: 1.75rem 0 .6rem; }
  .card { background: var(--card); border: 1px solid var(--line); padding: 1rem; margin: 0 0 .75rem; }
  .row { display:flex; justify-content:space-between; align-items:center; gap: 1rem; }
  .name { font-size: 1.05rem; }
  .meta { font-size: .8rem; color: var(--dim); margin-top: .2rem; word-break: break-all; }
  button { appearance:none; border:1px solid var(--line); background:#111; color:var(--text); padding:.55rem .8rem; font: inherit; letter-spacing:.04em; cursor:pointer; }
  button.on { border-color: var(--ok); color: var(--ok); }
  button.off { border-color: var(--bad); color: var(--bad); }
  button.big { width:100%; padding: 1rem; font-size: .85rem; letter-spacing:.16em; text-transform:uppercase; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input { width:100%; background:#111; border:1px solid var(--line); color:var(--text); padding:.55rem .7rem; font: inherit; }
  form { display:flex; gap:.5rem; margin-top:.6rem; }
  form input { flex:1; }
  ul { list-style:none; padding:0; margin:.5rem 0 0; }
  li { display:flex; justify-content:space-between; align-items:center; padding:.4rem 0; border-top:1px solid var(--line); font-size:.9rem; }
  .dot { width:.55rem; height:.55rem; border-radius:50%; display:inline-block; margin-right:.4rem; background:var(--dim); vertical-align:middle; }
  .dot.ok { background:var(--ok); }
  .dot.bad { background:var(--bad); }
  .dot.warn { background:#d4c27a; }
  p.warn { color:var(--bad); font-size:.85rem; }
  .code { font-size: 2rem; letter-spacing: .35em; font-weight: 600; }
  #hub { display:none; }
  #gate { display:block; }
  a { color: var(--ok); }
</style>
</head>
<body>
<main>
  <h1>Sandcloud</h1>
  <p class="meta" id="via"></p>

  <div id="gate">
    <div class="card">
      <div class="name" id="gate-title">Sign in</div>
      <div class="meta" id="gate-msg">Use Google. Apple sign-in comes later.</div>
      <div id="google-btn" style="margin-top:1rem"></div>
      <p class="meta" style="margin-top:1rem">Sign in with Apple — not enabled yet</p>
      <form id="pair-form" style="display:none">
        <input name="code" placeholder="6-digit code from the Pi" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        <button type="submit">Connect router</button>
      </form>
    </div>
  </div>

  <div id="hub">
    <div class="card">
      <div class="row">
        <div>
          <div class="name" id="ssid">Sandcloud</div>
          <div class="meta" id="summary">loading…</div>
          <div class="code" id="pair-code" style="display:none"></div>
        </div>
        <div id="health"></div>
      </div>
    </div>
    <button class="big off" id="kill" type="button">Internet off · LAN stays on</button>
    <div class="card row" style="margin-top:1rem">
      <div>
        <div class="name">Ad blocking</div>
        <div class="meta" id="ag-meta">AdGuard</div>
      </div>
      <button type="button" id="adblock">On</button>
    </div>
    <p class="meta"><button type="button" id="unpair">Disconnect this router from my account</button></p>
    <h2>Devices</h2>
    <div id="devices"></div>
    <h2>Block a site</h2>
    <div class="card">
      <form id="block-form"><input name="domain" placeholder="tiktok.com" autocomplete="off"><button type="submit">Block</button></form>
      <ul id="blocklist"></ul>
    </div>
    <h2>Allow a site</h2>
    <div class="card">
      <form id="allow-form"><input name="domain" placeholder="example.com" autocomplete="off"><button type="submit">Allow</button></form>
      <ul id="allowlist"></ul>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const LAN = ["http://10.10.10.1:8080", "http://10.42.0.1:8080"];
let mode = "remote";
let lanBase = "";
let state = null;

function worker() {
  return (window.WORKER_ORIGIN || "").replace(/\/$/, "");
}
function sameOriginPi() {
  const h = location.hostname;
  return h === "10.10.10.1" || h === "10.42.0.1" || h === "127.0.0.1" || h === "localhost";
}
function statusLabel(s) {
  return ({
    online: "Router online",
    offline: "Router offline",
    not_found: "Router not found",
    no_router: "No router connected",
  })[s] || s;
}

async function wfetch(path, body) {
  const r = await fetch(worker() + path, {
    method: body === undefined && path.startsWith("/me") ? "GET" : "POST",
    credentials: "include",
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (data.reauth) {
    showGate("Sign in again", "Verify with Google (required about once a week).");
    throw new Error("reauth");
  }
  return { r, data };
}

function showGate(title, msg) {
  $("gate").style.display = "block";
  $("hub").style.display = "none";
  $("gate-title").textContent = title;
  $("gate-msg").textContent = msg;
}

function showHub() {
  $("gate").style.display = "none";
  $("hub").style.display = "block";
}

function renderState(s, routerStatus) {
  state = s;
  $("ssid").textContent = (s && s.ssid) || "Sandcloud";
  $("summary").textContent = routerStatus ? statusLabel(routerStatus) : ((s && s.lan_ip) || "");
  const pairEl = $("pair-code");
  if (pairEl) {
    if (mode === "lan" && s && s.pair_code) {
      pairEl.style.display = "block";
      pairEl.textContent = s.pair_code;
      $("summary").textContent = "Enter this code on the website after Google sign-in (10 min).";
    } else {
      pairEl.style.display = "none";
      pairEl.textContent = "";
    }
  }
  const online = routerStatus ? routerStatus === "online" : true;
  $("health").innerHTML = '<span class="dot ' + (online ? "ok" : "bad") + '"></span>' + (routerStatus ? statusLabel(routerStatus) : "LAN");
  if (!s) return;
  $("kill").textContent = s.internet ? "Cut internet · keep LAN" : "Restore internet";
  $("kill").className = "big " + (s.internet ? "off" : "on");
  $("kill").disabled = !online && mode === "remote";
  $("ag-meta").textContent = s.adguard ? "AdGuard is up" : "AdGuard is down";
  $("adblock").textContent = s.adblock ? "On" : "Off";
  $("adblock").className = s.adblock ? "on" : "off";
  const box = $("devices");
  const devs = s.devices || [];
  if (!devs.length) box.innerHTML = '<p class="warn">No clients yet.</p>';
  else {
    box.innerHTML = devs.map((d) =>
      '<div class="card row"><div><div class="name">' + (d.name || d.ip) + '</div>' +
      '<div class="meta">' + d.ip + (d.mac ? " · " + d.mac : "") + "</div></div>" +
      '<button type="button" class="' + (d.blocked ? "off" : "on") + '" data-ip="' + d.ip + '" data-blocked="' + (d.blocked ? "1" : "0") + '">' +
      (d.blocked ? "Blocked" : "Allowed") + "</button></div>"
    ).join("");
    box.querySelectorAll("button[data-ip]").forEach((b) => {
      b.onclick = () => cmd("/api/device", { ip: b.dataset.ip, blocked: b.dataset.blocked !== "1" });
    });
  }
  const list = (id, arr, kind) => {
    $(id).innerHTML = (arr || []).map((d) =>
      "<li><span>" + d + '</span><button type="button" data-kind="' + kind + '" data-d="' + d + '">Remove</button></li>'
    ).join("") || "<li><span style='color:#8a8a8a'>None</span></li>";
    $(id).querySelectorAll("button[data-d]").forEach((b) => {
      b.onclick = () => cmd("/api/list", { kind: b.dataset.kind, domain: b.dataset.d, remove: true });
    });
  };
  list("blocklist", s.blocklist, "blocklist");
  list("allowlist", s.allowlist, "allowlist");
}

async function cmd(path, body) {
  if (mode === "lan") {
    const r = await fetch(lanBase + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const s = await r.json();
    renderState(s, "online");
    return;
  }
  const { data } = await wfetch("/cmd", { path, body });
  if (data && data.ssid) renderState(data, "online");
  else await refreshRemote();
}

async function refreshRemote() {
  if (!worker()) {
    showGate("No worker configured", "Set WORKER_ORIGIN in config.js after deploying the Cloudflare Worker.");
    return;
  }
  const { r, data } = await wfetch("/me/router");
  if (r.status === 401) {
    showGate("Sign in", "Use Google to connect a router.");
    $("pair-form").style.display = "none";
    renderGoogle();
    return;
  }
  if (data.status === "no_router") {
    showGate("No router connected", "On the Pi (Sandcloud Wi-Fi), open the LAN page and enter the 6-digit code here.");
    $("pair-form").style.display = "flex";
    return;
  }
  if (data.status === "not_found") {
    showGate("Router not found", "This account’s router never checked in. Re-pair from the Pi.");
    $("pair-form").style.display = "flex";
    return;
  }
  if (data.status === "offline") {
    showHub();
    renderState(data.snapshot || { ssid: "Sandcloud", devices: [] }, "offline");
    return;
  }
  showHub();
  renderState(data.snapshot || {}, "online");
}

function renderGoogle() {
  const id = window.GOOGLE_CLIENT_ID;
  if (!id || !window.google || !window.google.accounts) return;
  $("google-btn").innerHTML = "";
  window.google.accounts.id.initialize({
    client_id: id,
    callback: async (resp) => {
      try {
        await wfetch("/auth/google", { id_token: resp.credential });
        await refreshRemote();
      } catch (e) {}
    },
  });
  window.google.accounts.id.renderButton($("google-btn"), { theme: "filled_black", size: "large", width: 280 });
}
window.renderGoogle = renderGoogle;

$("pair-form").onsubmit = async (e) => {
  e.preventDefault();
  await wfetch("/pair", { code: e.target.code.value });
  e.target.reset();
  await refreshRemote();
};
$("unpair").onclick = async () => { await wfetch("/unpair", {}); await refreshRemote(); };
$("kill").onclick = () => cmd("/api/internet", { enabled: !(state && state.internet) });
$("adblock").onclick = () => cmd("/api/adblock", { enabled: !(state && state.adblock) });
$("block-form").onsubmit = (e) => { e.preventDefault(); cmd("/api/list", { kind: "blocklist", domain: e.target.domain.value }); e.target.reset(); };
$("allow-form").onsubmit = (e) => { e.preventDefault(); cmd("/api/list", { kind: "allowlist", domain: e.target.domain.value }); e.target.reset(); };

(async () => {
  if (sameOriginPi()) {
    mode = "lan";
    lanBase = "";
    $("via").textContent = "This is the Pi (LAN). Pairing code is below after load.";
    showHub();
    const r = await fetch("/api/state");
    const s = await r.json();
    renderState(s, "online");
    setInterval(async () => {
      const x = await fetch("/api/state");
      const st = await x.json();
      renderState(st, "online");
    }, 4000);
    return;
  }
  $("via").textContent = "Remote · " + (worker() || "worker not set");
  window.onGoogleLibraryLoad = renderGoogle;
  setTimeout(renderGoogle, 600);
  await refreshRemote();
  setInterval(() => { if (!document.hidden && $("hub").style.display === "block") refreshRemote(); }, 5000);
})();
</script>
</body>
</html>
